```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | PN Shoes Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<div class="top-bar">
    Join PN Shoes Store today
</div>


<header class="main-header">

    <div class="header-container">

        <a
            href="index.html"
            class="logo"
        >
            PN <span>SHOES</span>
        </a>

    </div>

</header>


<main>

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <small>
                    PN SHOES
                </small>

                <h1>
                    Create Account
                </h1>

                <p>
                    Create your PN Shoes account.
                </p>

            </div>


            <form id="registerForm">


                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        name="phone"
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <div class="footer-bottom">
            © 2026 PN Shoes Store.
        </div>

    </div>

</footer>


<script src="js/auth.js"></script>

</body>
</html>
```
