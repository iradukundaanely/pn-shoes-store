```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | PN Shoes Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<div class="top-bar">
    PN Shoes Store • Secure Checkout
</div>


<header class="main-header">

    <div class="header-container">

        <a
            href="index.html"
            class="logo"
        >
            PN <span>SHOES</span>
        </a>


        <div class="header-actions">

            <a
                href="cart.html"
                class="icon-btn cart-icon"
            >
                🛒
                <span
                    id="cartCount"
                    class="cart-count"
                >
                    0
                </span>
            </a>

        </div>

    </div>

</header>


<main>

    <section class="page-header">

        <div class="container">

            <small>
                PN SHOES
            </small>

            <h1>
                Checkout
            </h1>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <form
                id="checkoutForm"
                class="checkout-layout"
            >


                <div class="checkout-form">

                    <h2>
                        Delivery Information
                    </h2>


                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                        >

                    </div>


                    <div class="form-group">

                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            rows="4"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            required
                        >

                    </div>


                    <h2>
                        Payment Method
                    </h2>


                    <div class="payment-options">

                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="cash"
                                checked
                            >

                            <span>
                                Cash on Delivery
                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="mobile"
                            >

                            <span>
                                Mobile Payment
                            </span>

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary checkout-submit"
                    >
                        Place Order
                    </button>

                </div>


                <aside class="checkout-summary">

                    <h2>
                        Your Order
                    </h2>

                    <div id="checkoutItems">
                        <!-- Loaded by checkout.js -->
                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="checkoutSubtotal">
                            0 RWF
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="checkoutDelivery">
                            0 RWF
                        </strong>

                    </div>


                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <strong id="checkoutTotal">
                            0 RWF
                        </strong>

                    </div>

                </aside>

            </form>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <div class="footer-bottom">
            © 2026 PN Shoes Store. All rights reserved.
        </div>

    </div>

</footer>


<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
```
