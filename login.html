```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | PN Shoes Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<div class="top-bar">
    Welcome back to PN Shoes Store
</div>


<header class="main-header">

    <div class="header-container">

        <a
            href="index.html"
            class="logo"
        >
            PN <span>SHOES</span>
        </a>

        <a
            href="cart.html"
            class="icon-btn"
        >
            🛒
        </a>

    </div>

</header>


<main>

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <small>
                    PN SHOES
                </small>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your account.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="form-message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        <div class="footer-bottom">
            © 2026 PN Shoes Store.
        </div>

    </div>

</footer>


<script src="js/auth.js"></script>

</body>
</html>
```
